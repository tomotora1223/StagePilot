plugins { id 'com.android.application' }
android {
    namespace 'jp.stagepilot.remote'
    compileSdk 35
    defaultConfig { applicationId 'jp.stagepilot.remote'; minSdk 26; targetSdk 35; versionCode 21; versionName '0.21'; testInstrumentationRunner 'jp.stagepilot.remote.RemoteInstrumentation' }
    buildTypes { debug { debuggable true }; release { signingConfig signingConfigs.debug; debuggable false; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
