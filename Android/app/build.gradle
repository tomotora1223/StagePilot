plugins { id 'com.android.application' }
android {
    namespace 'jp.stagepilot.remote'
    compileSdk 35
    defaultConfig { applicationId 'jp.stagepilot.remote'; minSdk 26; targetSdk 35; versionCode 22; versionName '0.22'; testInstrumentationRunner 'jp.stagepilot.remote.RemoteInstrumentation' }
    buildTypes { debug { debuggable true }; release { signingConfig signingConfigs.debug; debuggable false; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'com.journeyapps:zxing-android-embedded:4.3.0' }
